<body>

    
    <script>
        var str = "1230 ";
        var pattern = /\b1/g;
        var result = (pattern).test(str);
        document.write(result + "<br>");
        alert(result);

        //do a global search for is followed by all
        var str2 = "This is all";
        var pattern2 = /is(?= all)/g;
        var result2 = (pattern2).test(str2);
        document.write(result2);
    </script>

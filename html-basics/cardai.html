<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      position: relative; /* important for absolute button positioning */
      width: 260px;
      height: 540px;
      background: #fefcfc;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      overflow: hidden;
    }

    .card h3 {
      margin: 15px 0 10px;
    }

    .card:hover {
      transform: scale(1.05);
      animation: forwards 3s ease-in-out;
      animation: backwards 0.3s ease-in-out;
    }

    @keyframes forwards {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }   
    @keyframes backwards {
      0% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    button {
      padding: 8px 12px;
      border: none;
      background: #007bff;
      color: rgb(249, 247, 247);
      border-radius: 4px;
      cursor: pointer;
      position: absolute; /* so we can move it around */
    }

    button:hover {
      background: #0056b3;
    }

    /* Position classes */
    .btn-top {
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .btn-bottom {
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .btn-right {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <img id="cardImg">
  <h3 id="cardTitle"></h3>
  <p id="cardDesc"></p>
  <button id="btn">Next</button>
</div>

<script>
  const cardText = [
    {
      title: "Solo Leveling",
      description: "Main character of Solo Leveling.",
      image: "img/sololeveling.jpg",
      buttonPosition: "bottom"
    },
    {
      title: "Naruto",
      description: "Anime character of Naruto.",
      image: "img/naruto.jpg",
      buttonPosition: "bottom"
    },
    {
      title: "One Piece",
      description: "Anime character of One Piece.",
      image: "img/onepiece.jpg",
      buttonPosition: "bottom"
    }
  ];

  let currentIndex = 0;

  const cardImg = document.getElementById("cardImg");
  const cardTitle = document.getElementById("cardTitle");
  const cardDesc = document.getElementById("cardDesc");
  const btn = document.getElementById("btn");

  function showCard(index) {
    cardImg.src = cardText[index].image;
    cardTitle.textContent = cardText[index].title;
    cardDesc.textContent = cardText[index].description;

    // Reset button classes and apply new one
    btn.className = "";
    btn.classList.add(`btn-${cardText[index].buttonPosition}`);
  }

  btn.addEventListener("click", function showCardNext() {
    currentIndex++;
    if (currentIndex >= cardText.length) {
      currentIndex = 0;
    }
    showCard(currentIndex);
  });

  showCard(currentIndex);
</script>

</body>
